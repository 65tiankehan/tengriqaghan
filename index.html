<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tengri Qaghan · 流媒体播放器</title>
  <meta name="description" content="Tengri Qaghan —— 跨平台流媒体播放器，支持 TMDB、Jellyfin/Emby、IPTV 与本地文件。" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0c;
      --panel: rgba(28, 28, 30, 0.72);
      --label: rgba(255, 255, 255, 0.92);
      --label-2: rgba(255, 255, 255, 0.62);
      --label-3: rgba(255, 255, 255, 0.38);
      --accent: #0091ff;
      --border: rgba(255, 255, 255, 0.1);
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", system-ui, sans-serif;
      color: var(--label);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(0, 145, 255, 0.18), transparent 60%),
        radial-gradient(800px 500px at 85% 110%, rgba(94, 92, 230, 0.16), transparent 60%),
        var(--bg);
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: 100%;
      max-width: 560px;
      text-align: center;
      animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--label-3);
      margin-bottom: 22px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(0, 145, 255, 0.7);
    }
    h1 {
      font-size: clamp(34px, 6vw, 52px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #fff, rgba(255,255,255,0.7));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.lead {
      font-size: 16px;
      line-height: 1.7;
      color: var(--label-2);
      max-width: 460px;
      margin: 0 auto 30px;
    }
    .card {
      background: var(--panel);
      backdrop-filter: blur(40px) saturate(1.8);
      -webkit-backdrop-filter: blur(40px) saturate(1.8);
      border: 0.5px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      display: grid;
      gap: 14px;
      text-align: left;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }
    .row .k { color: var(--label-2); }
    .row .v { color: var(--label); font-weight: 500; }
    .pill {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(48, 209, 88, 0.14);
      color: #30d158;
      border: 0.5px solid rgba(48, 209, 88, 0.3);
    }
    .links {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 22px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.18s ease, background 0.2s ease;
    }
    a.btn.primary { background: rgba(255,255,255,0.95); color: #000; }
    a.btn.primary:hover { background: #fff; transform: translateY(-1px); }
    a.btn.ghost {
      background: rgba(255,255,255,0.06);
      color: var(--label);
      border: 0.5px solid var(--border);
    }
    a.btn.ghost:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    footer {
      margin-top: 30px;
      font-size: 12px;
      color: var(--label-3);
    }
    footer a { color: var(--label-2); text-decoration: none; margin: 0 6px; }
    footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="dot"></span> Tengri Qaghan</div>
    <h1>跨平台流媒体播放器</h1>
    <p class="lead">
      支持 TMDB 元数据、Jellyfin / Emby 点播、IPTV 直播与本地文件播放，
      配合 3D 歌单架、粒子视觉与玻璃质感，打造你的私人影院。
    </p>

    <div class="card">
      <div class="row">
        <span class="k">平台</span>
        <span class="v">Windows · macOS · Linux</span>
      </div>
      <div class="row">
        <span class="k">技术栈</span>
        <span class="v">Electron · React · TypeScript</span>
      </div>
      <div class="row">
        <span class="k">状态</span>
        <span class="pill">即将上线</span>
      </div>
    </div>

    <div class="links">
      <a class="btn primary" href="https://github.com/65tiankehan/tengriqaghan-releases/releases" target="_blank" rel="noreferrer">
        下载最新版本
      </a>
      <a class="btn ghost" href="https://github.com/65tiankehan/tengriqaghan" target="_blank" rel="noreferrer">
        GitHub 源码
      </a>
    </div>

    <footer>
      © <span id="y"></span> Tengri Qaghan ·
      <a href="https://github.com/65tiankehan/tengriqaghan-Opendata" target="_blank" rel="noreferrer">开放数据</a>·
      <a href="https://github.com/65tiankehan/tengriqaghan-releases/releases" target="_blank" rel="noreferrer">更新日志</a>
    </footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
